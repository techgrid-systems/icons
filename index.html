<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techgrid Systems — Icon Library</title>
    
    <!-- Favicon Icon -->
    <link rel="icon" type="image/png" href="https://icons.techgrid-systems.org.uk/tgs-primary.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Orbitron -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#121212',
                            header: '#1A1A1A',
                            border: '#2D2D2D',
                            accent: '#00F0FF',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        tech: ['Orbitron', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #121212;
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
            transition: filter 0.2s ease;
        }

        /* Image blurring on screenshot attempt */
        .image-container img {
            transition: filter 0.2s ease, opacity 0.2s ease;
        }

        body.screenshot-detected .image-container img,
        body.screenshot-detected #lightbox-img {
            filter: blur(40px) grayscale(100%) !important;
            opacity: 0.1 !important;
        }

        /* Overlay indicator on screenshot attempt */
        .image-container {
            position: relative;
            overflow: hidden;
        }

        .screenshot-warning-overlay {
            position: absolute;
            inset: 0;
            background: rgba(18, 18, 18, 0.95);
            display: flex;
            flex-col: column;
            align-items: center;
            justify-content: center;
            color: #00F0FF;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 10;
        }

        body.screenshot-detected .screenshot-warning-overlay {
            opacity: 1;
        }

        .list-row {
            transition: all 0.2s ease-in-out;
        }

        .list-row:hover {
            background-color: #1E293B;
        }

        /* Prevent image selection and drag */
        img {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            pointer-events: none;
        }

        #lightbox {
            transition: opacity 0.2s ease-in-out, visibility 0.2s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen bg-[#121212] flex flex-col justify-between select-none">

    <div>
        <!-- Top Navigation Bar (Fortinet Style) -->
        <header class="w-full bg-[#1A1A1A] border-b border-[#2D2D2D] px-6 sm:px-12 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-xl sm:text-2xl font-black font-tech tracking-wider text-white">TECH</span>
                
                <div class="h-7 sm:h-8 px-1.5 py-0.5 rounded bg-[#0D1424] border border-cyan-500/40 flex items-center justify-center">
                    <img src="https://techgrid-systems.github.io/techgrid-systems-logos/tgs-primary.png" 
                         alt="Techgrid Logo" 
                         draggable="false"
                         onerror="this.src='https://placehold.co/80x40/0d1424/00f0ff?text=TGS'"
                         class="h-full object-contain">
                </div>

                <span class="text-xl sm:text-2xl font-black font-tech tracking-wider text-cyan-400">GRID SYSTEMS</span>
                <span class="text-lg sm:text-xl font-light font-tech text-slate-300 ml-2 border-l border-slate-700 pl-4 hidden sm:inline">Icon Library</span>
            </div>

            <div class="text-xs text-slate-400 flex items-center gap-2 font-mono">
                <i class="fa-solid fa-lock text-cyan-400"></i>
                <span class="hidden md:inline">Protected View Only</span>
            </div>
        </header>

        <!-- Main Search & Filter Control Bar Section -->
        <main class="max-w-7xl mx-auto px-4 sm:px-8 py-8 w-full">
            
            <div class="bg-[#1A1A1A] border border-[#2D2D2D] rounded-xl p-4 sm:p-6 mb-8 shadow-xl">
                <div class="flex flex-col sm:flex-row items-stretch gap-3">
                    
                    <!-- Category Dropdown Select (Left Side) -->
                    <div class="relative w-full sm:w-64 shrink-0">
                        <select id="category-filter" onchange="filterAssets()"
                                class="w-full h-full pl-4 pr-10 py-3 bg-[#242424] border border-[#3A3A3A] rounded-lg text-sm text-slate-200 focus:outline-none focus:border-cyan-400 cursor-pointer appearance-none transition">
                            <option value="All">All Categories</option>
                            <option value="Cloud">Cloud</option>
                            <option value="Training">Training</option>
                            <option value="Guard">Guard</option>
                            <option value="Primary">Primary</option>
                            <option value="Sandbox">Sandbox</option>
                            <option value="Siem">Siem</option>
                            <option value="Client Portal">Client Portal</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>

                    <!-- Search Input Bar (Right Side) -->
                    <div class="relative w-full flex-grow">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-magnifying-glass text-sm"></i>
                        </div>
                        <input type="text" id="search-input" onkeyup="filterAssets()" placeholder="Search icons (e.g. cloud, guard, training...)"
                               class="w-full pl-11 pr-4 py-3 bg-[#242424] border border-[#3A3A3A] rounded-lg text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition">
                    </div>

                </div>
            </div>

            <!-- List View Results -->
            <div class="bg-[#1A1A1A] border border-[#2D2D2D] rounded-xl overflow-hidden shadow-xl">
                <div class="hidden sm:grid grid-cols-12 gap-4 px-6 py-3.5 border-b border-[#2D2D2D] text-xs font-semibold text-slate-400 uppercase tracking-wider bg-[#141414]">
                    <div class="col-span-6">Icon Asset Name</div>
                    <div class="col-span-3">Category</div>
                    <div class="col-span-3 text-right">Action</div>
                </div>

                <div id="gallery-list" class="divide-y divide-[#2D2D2D]">
                    <!-- Rendered via JS -->
                </div>
            </div>

        </main>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all">
        <button id="lightbox-close" onclick="closeLightbox()" aria-label="Close Preview"
                class="absolute top-6 right-6 text-slate-400 hover:text-white bg-slate-800/80 p-3 rounded-full hover:bg-slate-700 transition z-20">
            <i class="fa-solid fa-xmark text-xl w-6 h-6 flex items-center justify-center"></i>
        </button>
        <div class="max-w-4xl max-h-[85vh] flex flex-col items-center">
            <div class="relative p-4 rounded-2xl bg-[#1A1A1A] border border-cyan-500/30 shadow-2xl mb-4 overflow-hidden image-container">
                <div class="screenshot-warning-overlay">
                    <i class="fa-solid fa-shield-halved text-2xl mb-1 text-cyan-400"></i>
                    <span>Protected Image</span>
                </div>
                <img id="lightbox-img" src="" alt="Full Preview" draggable="false" class="max-h-[65vh] object-contain rounded-lg">
            </div>
            <div class="text-center">
                <h3 id="lightbox-title" class="text-xl font-bold font-tech text-white"></h3>
                <p id="lightbox-filename" class="text-sm font-mono text-cyan-400 mt-1"></p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-[#2D2D2D] mt-12 bg-[#1A1A1A] py-6">
        <div class="max-w-7xl mx-auto px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-4">
            <p>&copy; 2026 Techgrid Systems. All brand rights reserved.</p>
            <p class="flex items-center gap-2">
                <a href="https://www.techgrid-systems.org.uk" target="_blank" class="hover:text-cyan-400 transition">Techgrid Organization</a>
            </p>
        </div>
    </footer>

    <!-- Script to render assets and handle lightbox -->
    <script>
        const BASE_URL = "https://techgrid-systems.github.io/icons";

        const assets = [
            { name: "Techgrid Primary", filename: "tgs-primary.png", category: "Primary", type: "PNG Logo" },
            { name: "Techgrid Cloud", filename: "tgs-cloud.png", category: "Cloud", type: "PNG Icon" },
            { name: "Techgrid Guard", filename: "tgs-guard.png", category: "Guard", type: "PNG Icon" },
            { name: "Techgrid Sandbox", filename: "tgs-sandbox.png", category: "Sandbox", type: "PNG Icon" },
            { name: "Techgrid SIEM", filename: "tgs-siem.png", category: "Siem", type: "PNG Icon" },
            { name: "Techgrid Training", filename: "tgs-training.jpeg", category: "Training", type: "JPEG Image" },
            { name: "Techgrid ClientPortal", filename: "tgs-cp.jpeg", category: "Client Portal", type: "JPEG Image" },
        ];

        const galleryList = document.getElementById('gallery-list');
        const searchInput = document.getElementById('search-input');
        const categoryFilter = document.getElementById('category-filter');

        function handleImageError(imgElement, title) {
            imgElement.onerror = null;
            imgElement.src = `https://placehold.co/600x400/0d1424/00f0ff?text=${encodeURIComponent(title)}`;
        }

        function filterAssets() {
            const query = searchInput.value.toLowerCase().trim();
            const category = categoryFilter.value;

            const filtered = assets.filter(asset => {
                const matchesCategory = (category === 'All' || asset.category === category);
                const matchesQuery = asset.name.toLowerCase().includes(query) || asset.filename.toLowerCase().includes(query);
                return matchesCategory && matchesQuery;
            });

            if (filtered.length === 0) {
                galleryList.innerHTML = `
                    <div class="p-12 text-center text-slate-500">
                        <i class="fa-solid fa-magnifying-glass text-2xl mb-2 text-slate-600"></i>
                        <p class="text-sm">No icons found matching your selection.</p>
                    </div>
                `;
                return;
            }

            galleryList.innerHTML = filtered.map((asset) => {
                const imgUrl = `${BASE_URL}/${asset.filename}`;
                return `
                <div class="list-row p-4 sm:px-6 flex flex-col sm:grid sm:grid-cols-12 gap-4 items-center justify-between cursor-pointer"
                     onclick="openLightbox('${imgUrl}', '${asset.name}')">
                    
                    <div class="col-span-6 flex items-center gap-4 w-full">
                        <div class="w-12 h-12 rounded-lg bg-[#0F172A] border border-slate-700 p-2 flex items-center justify-center shrink-0 image-container">
                            <div class="screenshot-warning-overlay">
                                <i class="fa-solid fa-lock text-xs"></i>
                            </div>
                            <img src="${imgUrl}" 
                                 alt="${asset.name}" 
                                 draggable="false"
                                 onerror="handleImageError(this, '${asset.name}')"
                                 class="max-h-full max-w-full object-contain">
                        </div>
                        <div class="min-w-0">
                            <h3 class="text-sm font-bold text-white font-tech truncate">${asset.name}</h3>
                        </div>
                    </div>

                    <div class="col-span-3 w-full sm:w-auto flex items-center">
                        <span class="px-2.5 py-1 rounded bg-[#242424] text-cyan-400 text-xs font-mono font-medium border border-slate-700">
                            ${asset.category}
                        </span>
                    </div>

                    <div class="col-span-3 flex justify-end w-full sm:w-auto">
                        <button onclick="event.stopPropagation(); openLightbox('${imgUrl}', '${asset.name}')" 
                                class="w-full sm:w-auto px-4 py-2 rounded-lg bg-cyan-950/60 hover:bg-cyan-500 hover:text-black text-cyan-400 border border-cyan-500/30 text-xs font-semibold transition-all duration-200 flex items-center justify-center gap-2">
                            <i class="fa-regular fa-eye"></i> Preview Icon
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        // Lightbox Popup Controls
        function openLightbox(src, title) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxTitle = document.getElementById('lightbox-title');
            const lightboxFilename = document.getElementById('lightbox-filename');

            lightboxImg.src = src;
            lightboxImg.onerror = function() {
                handleImageError(this, title);
            };
            lightboxTitle.innerText = title;
            if (lightboxFilename) lightboxFilename.innerText = '';

            lightbox.classList.remove('opacity-0', 'pointer-events-none');
            lightbox.classList.add('opacity-100', 'pointer-events-auto');
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('opacity-100', 'pointer-events-auto');
            lightbox.classList.add('opacity-0', 'pointer-events-none');
        }

        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });

        // --- Targeted PrintScreen / Screenshot Image Blurring ---
        
        function triggerImageBlur() {
            // Add protection class to trigger blur on all image tags
            document.body.classList.add('screenshot-detected');
            
            // Clear clipboard if possible
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText('');
            }

            // Restore images after 3.5 seconds
            setTimeout(() => {
                document.body.classList.remove('screenshot-detected');
            }, 3500);
        }

        // Listen for PrintScreen key and screenshot shortcuts
        document.addEventListener('keyup', (e) => {
            if (e.key === 'PrintScreen' || e.code === 'PrintScreen') {
                triggerImageBlur();
            }
        });

        document.addEventListener('keydown', (e) => {
            // Windows Snipping Tool / Mac Screenshot Hotkeys (Win+Shift+S, Cmd+Shift+3, Cmd+Shift+4)
            if ((e.metaKey || e.ctrlKey) && e.shiftKey && (e.key === 's' || e.key === 'S' || e.key === '3' || e.key === '4')) {
                triggerImageBlur();
            }
        });

        // Also trigger blur when browser window loses focus (e.g. Snipping tool opening)
        window.addEventListener('blur', () => {
            document.body.classList.add('screenshot-detected');
        });

        window.addEventListener('focus', () => {
            document.body.classList.remove('screenshot-detected');
        });

        // Anti-save / Protection Event Listeners
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        document.addEventListener('dragstart', (e) => {
            if (e.target.tagName === 'IMG') {
                e.preventDefault();
            }
        });

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.key === 'p' || e.key === 'P')) {
                e.preventDefault();
            }
            if (e.key === 'Escape') closeLightbox();
        });

        window.addEventListener('DOMContentLoaded', filterAssets);
    </script>
</body>
</html>
